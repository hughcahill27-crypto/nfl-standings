name: Update playoff probabilities
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python update_playoffs.py
      - run: |
          git config user.name 'Playoff updater'
          git config user.email 'actions@users.noreply.github.com'
          git add playoff-data.json
          if [ -f playoff-history.json ]; then git add playoff-history.json; fi
          git diff --cached --quiet || (git commit -m 'Refresh playoff probabilities' && git push)
