<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>NFL Division + ESPN League Board</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#07111f;color:#f3f7ff;font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:7px 12px;border-bottom:1px solid #3c516c}.top h1{font-size:clamp(12px,1.8vh,19px);letter-spacing:1.5px;margin:0}.status{font-size:10px;color:#c7d7ed}.layout{flex:0 0 55%;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px 9px 3px}.conference{min-height:0;display:flex;flex-direction:column;background:#111e31;border:1px solid #334962;border-radius:9px;padding:6px}.conference h2{text-align:center;margin:0 0 5px;padding:5px;border-radius:6px;font-size:clamp(13px,2vh,19px)}.afc h2{background:#b43145}.nfc h2{background:#167dc6}.divisions{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between}.division{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:2px}.division h3{margin:0 0 2px;font-size:clamp(8px,1.1vh,11px);color:#aac2e3;letter-spacing:1.5px}.team{display:flex;flex:1;min-height:0;align-items:center;gap:4px;margin:1px 0;padding:1px 4px;border-radius:4px;background:#203149;font-size:clamp(9px,1.35vh,14px)}.team img{height:clamp(13px,1.9vh,21px);width:clamp(13px,1.9vh,21px);object-fit:contain}.rank{width:12px;color:#aabbd0}.name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record{font-variant-numeric:tabular-nums;color:#d9e6f8}.moved{outline:1px solid #46db8d;background:#204537}.league{flex:1;min-height:0;margin:3px 9px 0;padding:5px 7px 7px;background:#111e31;border:1px solid #334962;border-radius:9px;display:flex;flex-direction:column}.leaguehead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}.leaguehead h2{font-size:clamp(11px,1.55vh,16px);margin:0;letter-spacing:1px}.leaguehead small{font-size:9px;color:#b4c4d9}.leaguegrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));grid-auto-flow:column;gap:2px 5px}.leagueitem{display:flex;min-width:0;align-items:center;gap:3px;padding:1px 4px;background:#203149;border-radius:4px;font-size:clamp(9px,1.3vh,13px)}.leagueitem img{height:clamp(13px,1.85vh,20px);width:clamp(13px,1.85vh,20px);object-fit:contain}.leagueitem .rank{width:17px}.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:4px 10px 6px;font-size:9px;color:#b4c4d9}button{background:#314b6e;color:white;border:1px solid #6383a9;border-radius:5px;padding:4px 9px;font-size:11px}@media(max-width:580px){.layout{gap:4px;padding:4px}.conference{padding:4px}.league{margin:2px 4px 0;padding:4px}.leaguegrid{gap:2px}.leagueitem{padding:1px 2px;gap:2px;font-size:9px}.leagueitem img{width:14px;height:14px}.leagueitem .rank{width:13px}}
</style></head><body><header class="top"><h1>NFL <span style="color:#8db9f5">STANDINGS BOARD</span></h1><span class="status" id="status">Loading…</span></header><main class="layout"><section class="conference afc"><h2>AFC</h2><div class="divisions" id="AFC"></div></section><section class="conference nfc"><h2>NFC</h2><div class="divisions" id="NFC"></div></section></main><section class="league"><div class="leaguehead"><h2>LEAGUE STANDINGS <span style="color:#8db9f5">ALL 32</span></h2><small id="leagueStatus">ESPN · Loading league standings</small></div><div class="leaguegrid" id="leagueGrid"></div></section><footer class="foot"><span>ESPN division order · ESPN league records · Green = moved in 16h</span><button onclick="load()">Refresh ↻</button></footer><script>
(function(){'use strict';var divisions=['North','East','South','West'];var teams={
'BAL':['AFC','North','Ravens'],'PIT':['AFC','North','Steelers'],'CIN':['AFC','North','Bengals'],'CLE':['AFC','North','Browns'],'BUF':['AFC','East','Bills'],'NE':['AFC','East','Patriots'],'MIA':['AFC','East','Dolphins'],'NYJ':['AFC','East','Jets'],'HOU':['AFC','South','Texans'],'IND':['AFC','South','Colts'],'JAX':['AFC','South','Jaguars'],'TEN':['AFC','South','Titans'],'DEN':['AFC','West','Broncos'],'KC':['AFC','West','Chiefs'],'LAC':['AFC','West','Chargers'],'LV':['AFC','West','Raiders'],'CHI':['NFC','North','Bears'],'DET':['NFC','North','Lions'],'GB':['NFC','North','Packers'],'MIN':['NFC','North','Vikings'],'DAL':['NFC','East','Cowboys'],'NYG':['NFC','East','Giants'],'PHI':['NFC','East','Eagles'],'WSH':['NFC','East','Commanders'],'ATL':['NFC','South','Falcons'],'CAR':['NFC','South','Panthers'],'NO':['NFC','South','Saints'],'TB':['NFC','South','Buccaneers'],'ARI':['NFC','West','Cardinals'],'LA':['NFC','West','Rams'],'SF':['NFC','West','49ers'],'SEA':['NFC','West','Seahawks']};var aliases={WAS:'WSH',JAC:'JAX',OAK:'LV',SD:'LAC',STL:'LA',LAR:'LA'};function norm(s){s=String(s||'').toUpperCase();return aliases[s]||s}function stat(e,k){var a=e.stats||[];for(var i=0;i<a.length;i++)if(a[i].name===k||a[i].abbreviation===k)return a[i].value!==undefined?a[i].value:a[i].displayValue;return null}function groupDivision(n){var a=[n.name,n.displayName,n.shortDisplayName,n.abbreviation,n.group&&n.group.name,n.group&&n.group.displayName];for(var i=0;i<a.length;i++){var v=String(a[i]||'').toUpperCase();for(var c of ['AFC','NFC'])for(var d of divisions)if(v.indexOf(c)!==-1&&v.indexOf(d.toUpperCase())!==-1)return c+' '+d}return null}function walk(n,found,depth,scope){if(!n||typeof n!=='object'||depth>12)return;var here=groupDivision(n)||scope;if(n.standings&&Array.isArray(n.standings.entries)){var entries=n.standings.entries;for(var i=0;i<entries.length;i++){var e=entries[i],t=e.team||{},abbr=norm(t.abbreviation||t.shortDisplayName);if(!teams[abbr]||stat(e,'wins')===null)continue;var key=teams[abbr][0]+' '+teams[abbr][1];if(!found[key])found[key]=[];found[key].push({abbr:abbr,w:Number(stat(e,'wins')),l:Number(stat(e,'losses')),t:Number(stat(e,'ties')||0),sourceOrder:i+1,divisionGroup:here===key})}}if(Array.isArray(n.children))for(var j=0;j<n.children.length;j++)walk(n.children[j],found,depth+1,here)}function store(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return {}}}function logo(id){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+id.toLowerCase()+'.png'}function record(e){return e.w+'-'+e.l+(e.t?'-'+e.t:'')}function renderDiv(data){var old=store('nfl_simple_previous'),highlights=store('nfl_wall_highlights_16h'),now={},stamp=Date.now();Object.keys(highlights).forEach(function(k){if(!highlights[k]||highlights[k].until<=stamp)delete highlights[k]});['AFC','NFC'].forEach(function(c){var html='';divisions.forEach(function(d){html+='<div class="division"><h3>'+d.toUpperCase()+'</h3>';data[c+' '+d].forEach(function(e,i){var rank=i+1,prior=old[e.abbr];if(typeof prior==='number'&&prior!==rank)highlights[e.abbr]={until:stamp+57600000,from:prior,to:rank};now[e.abbr]=rank;var h=highlights[e.abbr];html+='<div class="team'+(h?' moved':'')+'"><span class="rank">'+rank+'</span><img src="'+logo(e.abbr)+'" alt=""><span class="name">'+teams[e.abbr][2]+(h?' '+(h.to<h.from?'↑':'↓'):'')+'</span><span class="record">'+record(e)+'</span></div>'});html+='</div>'});document.getElementById(c).innerHTML=html});try{localStorage.setItem('nfl_simple_previous',JSON.stringify(now));localStorage.setItem('nfl_wall_highlights_16h',JSON.stringify(highlights))}catch(e){}}function loadLeague(data){
 // League table is built from the SAME ESPN division feed, so no additional service or file is needed.
 // ESPN's 32-team interconference tiebreaker order is not available in this division feed.
 // Group identical winning percentages as tied ranks instead of inventing a tiebreaker.
 var all=[];['AFC','NFC'].forEach(function(c){divisions.forEach(function(d){data[c+' '+d].forEach(function(e){all.push(e)})})});
 if(all.length!==32||new Set(all.map(function(e){return e.abbr})).size!==32)throw Error('ESPN did not return 32 teams');
 all.sort(function(a,b){var pa=(a.w+a.t/2)/(a.w+a.l+a.t||1),pb=(b.w+b.t/2)/(b.w+b.l+b.t||1);return pb-pa||b.w-a.w||a.abbr.localeCompare(b.abbr)});
 var html='',lastPct=null,rank=1,tieCount=0;
 all.forEach(function(e,i){var pct=(e.w+e.t/2)/(e.w+e.l+e.t||1);if(lastPct===null||Math.abs(pct-lastPct)>0.0000001){rank=i+1;lastPct=pct} else tieCount++;
 html+='<div class="leagueitem"><span class="rank">'+rank+(rank!==i+1?'=':'')+'</span><img src="'+logo(e.abbr)+'" alt=""><span class="name">'+teams[e.abbr][2]+'</span><span class="record">'+record(e)+'</span></div>'});
 document.getElementById('leagueGrid').innerHTML=html;
 document.getElementById('leagueStatus').textContent='ESPN · record ranking (ties share rank)';
}
window.load=function(){document.getElementById('status').textContent='Checking ESPN…';var u='https://site.web.api.espn.com/apis/v2/sports/football/nfl/standings?region=us&lang=en&contentorigin=espn&type=0&level=3&sort=winpercent%3Adesc%2Cplayoffseed%3Aasc&season=2026&seasontype=2&_='+Date.now();fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(raw){var found={};walk(raw,found,0);var data={};['AFC','NFC'].forEach(function(c){divisions.forEach(function(d){var k=c+' '+d,all=found[k]||[],unique={};all.forEach(function(e){if(!unique[e.abbr]||(e.divisionGroup&&!unique[e.abbr].divisionGroup))unique[e.abbr]=e});var arr=Object.keys(unique).map(function(id){return unique[id]});if(arr.length!==4||!arr.every(function(e){return e.divisionGroup})||new Set(arr.map(function(e){return e.sourceOrder})).size!==4)throw Error('No division order for '+k);arr.sort(function(a,b){return a.sourceOrder-b.sourceOrder});data[k]=arr})});renderDiv(data);loadLeague(data);document.getElementById('status').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}).catch(function(e){document.getElementById('status').textContent='ESPN update failed: '+e.message})};load();setInterval(load,300000)})();
</script></body></html>
